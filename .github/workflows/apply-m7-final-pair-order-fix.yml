name: Apply final M7 pair ordering fix

on:
  push:
    branches:
      - "fix/m7-final-pair-order"

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/m7-final-pair-order
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Apply and validate exact fix
        run: |
          python .github/scripts/apply_m7_final_pair_order_fix.py
          uv run ruff format src/echoes/final_discovery/m7_adapter.py tests/unit/test_final_discovery_m7_final_order.py
          uv run ruff check src/echoes/final_discovery/m7_adapter.py tests/unit/test_final_discovery_m7_final_order.py
          uv run pytest -q tests/unit/test_final_discovery_m7_final_order.py tests/unit/test_final_discovery_m7_adapter.py tests/unit/test_final_discovery_m7_positions.py
      - name: Commit fix and remove temporary automation
        run: |
          rm .github/workflows/apply-m7-final-pair-order-fix.yml
          rm .github/scripts/apply_m7_final_pair_order_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/echoes/final_discovery/m7_adapter.py tests/unit/test_final_discovery_m7_final_order.py .github/workflows/apply-m7-final-pair-order-fix.yml .github/scripts/apply_m7_final_pair_order_fix.py
          git commit -m "Order M7 projection by final candidate identity"
          git push origin HEAD:fix/m7-final-pair-order
