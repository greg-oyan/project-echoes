name: Temporary Ruff Format Apply

on:
  push:
    branches: [fix/m7-zero-based-positions]

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Apply exact formatter output and remove this temporary workflow
        run: |
          uv run ruff format src/echoes/final_discovery/m7_adapter.py
          rm -- .github/workflows/temporary-ruff-format-diff.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/echoes/final_discovery/m7_adapter.py .github/workflows/temporary-ruff-format-diff.yml
          git commit -m 'Apply Ruff formatting to M7 position fix'
          git push origin HEAD:fix/m7-zero-based-positions
