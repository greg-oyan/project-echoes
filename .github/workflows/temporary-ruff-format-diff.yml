name: Temporary Ruff Format Diff

on:
  push:
    branches: [fix/m7-zero-based-positions]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --locked
      - name: Print exact formatter diff
        run: |
          uv run ruff format src/echoes/final_discovery/m7_adapter.py
          git diff -- src/echoes/final_discovery/m7_adapter.py
          test -z "$(git status --porcelain -- src/echoes/final_discovery/m7_adapter.py)"
