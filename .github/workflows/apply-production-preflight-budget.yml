name: Apply production preflight and budget hardening

on:
  push:
    branches:
      - fix/stage1-knownness-memory-bound

permissions:
  contents: write

concurrency:
  group: apply-production-preflight-budget-hardening
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/stage1-knownness-memory-bound
          fetch-depth: 0

      - name: Apply and syntax-check exact patch
        run: |
          set -Eeuo pipefail
          python3 scripts/_apply_production_hardening_once.py
          bash -n cloud/launch_final_discovery.sh
          bash -n cloud/launch_final_discovery_scaleway.sh
          python3 -m py_compile \
            tests/unit/test_final_discovery_launch_hardening.py \
            tests/unit/test_final_discovery_cloud_scripts.py \
            tests/unit/test_final_discovery_scaleway_adapter.py
          grep -F -q 'FINAL_DISCOVERY_PREFLIGHT_COMPLETE' \
            cloud/launch_final_discovery.sh
          grep -F -q \
            'projected_all_in = accrued + projected_future_infrastructure + reserve' \
            cloud/launch_final_discovery.sh
          grep -F -q 'exec bash "$adapter" "$@"' \
            cloud/launch_final_discovery_scaleway.sh

      - name: Commit exact patch once
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "Reviewed hardening patch is already committed."
            exit 0
          fi
          git config user.name "Project Echoes CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            cloud/launch_final_discovery.sh \
            cloud/launch_final_discovery_scaleway.sh \
            cloud/final-discovery.env.example \
            cloud/final-discovery-scaleway.env.example \
            tests/unit/test_final_discovery_cloud_scripts.py \
            tests/unit/test_final_discovery_scaleway_adapter.py \
            tests/unit/test_final_discovery_launch_hardening.py
          git commit -m "Add no-service production preflight and measured budget gate"
          git push origin HEAD:fix/stage1-knownness-memory-bound
