name: Apply production preflight and budget hardening

on:
  push:
    branches:
      - fix/stage1-knownness-memory-bound

permissions:
  contents: write

concurrency:
  group: apply-production-preflight-budget-hardening
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/stage1-knownness-memory-bound
          fetch-depth: 0

      - name: Apply exact launch hardening patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          launcher_path = Path("cloud/launch_final_discovery.sh")
          launcher = launcher_path.read_text(encoding="utf-8")

          old_usage = """Usage: sudo bash /srv/project-echoes/repo/cloud/launch_final_discovery.sh

Fail-closed owner launcher for the single final-discovery-v1 production
worker. It never provisions, purchases, stops, deletes, or polls a cloud
resource. It starts one detached systemd service, takes one startup snapshot,
and exits.
"""
          new_usage = """Usage:
  sudo bash /srv/project-echoes/repo/cloud/launch_final_discovery.sh --preflight-only
  sudo bash /srv/project-echoes/repo/cloud/launch_final_discovery.sh

Fail-closed owner launcher for the single final-discovery-v1 production
worker. Preflight performs every local, budget, model, M7 identity, credential,
and output-namespace check but never creates a service or launch record. Launch
starts one detached systemd service, takes one startup snapshot, and exits. The
script never provisions, purchases, stops, deletes, or polls a cloud resource.
"""
          if old_usage in launcher:
              launcher = launcher.replace(old_usage, new_usage, 1)
          elif new_usage not in launcher:
              raise SystemExit("launcher usage contract drifted")

          old_args = """if (($#)); then
    case "$1" in
        -h|--help)
            (($# == 1)) || { usage >&2; exit 2; }
            usage
            exit 0
            ;;
        *)
            usage >&2
            exit 2
            ;;
    esac
fi
"""
          new_args = """launch_mode="launch"
if (($#)); then
    case "$1" in
        --preflight-only)
            (($# == 1)) || { usage >&2; exit 2; }
            launch_mode="preflight"
            ;;
        -h|--help)
            (($# == 1)) || { usage >&2; exit 2; }
            usage
            exit 0
            ;;
        *)
            usage >&2
            exit 2
            ;;
    esac
fi
"""
          if old_args in launcher:
              launcher = launcher.replace(old_args, new_args, 1)
          elif new_args not in launcher:
              raise SystemExit("launcher argument parser contract drifted")

          old_required = """    ECHOES_SERVER_CREATED_AT_UTC
    ECHOES_B2_COST_RESERVE_USD
"""
          new_required = """    ECHOES_SERVER_CREATED_AT_UTC
    ECHOES_ACCRUED_INFRASTRUCTURE_USD
    ECHOES_ACCRUED_COST_VERIFIED_AT_UTC
    ECHOES_B2_COST_RESERVE_USD
"""
          if old_required in launcher:
              launcher = launcher.replace(old_required, new_required, 1)
          elif new_required not in launcher:
              raise SystemExit("launcher required environment inventory drifted")

          old_metadata = """    ECHOES_FINAL_DISCOVERY_DISK_FLOOR_GIB ECHOES_FINAL_DISCOVERY_RUNTIME_HOURS
    ECHOES_HARD_BUDGET_USD
"""
          new_metadata = """    ECHOES_FINAL_DISCOVERY_DISK_FLOOR_GIB ECHOES_FINAL_DISCOVERY_RUNTIME_HOURS
    ECHOES_HARD_BUDGET_USD ECHOES_ACCRUED_INFRASTRUCTURE_USD
    ECHOES_ACCRUED_COST_VERIFIED_AT_UTC
"""
