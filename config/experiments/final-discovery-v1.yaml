schema_version: 1
experiment_id: final-discovery-v1
status: preregistered_preproduction
research_question: >-
  Can independent lexical, semantic, grammatical/syntactic, structural, and anomaly
  evidence identify passage relationships that survive knownness filtering, data-quality
  controls, English-feature ablation, and empirical null calibration?
random_seed: 9101
passage_scope: whole_canon_verse_primary_with_registered_sensitivities

inputs:
  - artifact_id: m7-canonical-schema-v1
    role: canonical_m7
    source: b2:project-echoes-archive/m7/canonical-schema-v1
    required: true
    authentication: [object_inventory, manifest_sha256, table_hashes, file_hashes]
    expected_manifest_sha256: e56a1d3ee4f9707c17e7a25dc6b3d82ad5ec9a9bb28234762d58179142ebf6b6
  - artifact_id: m5-passages-schema-v1
    role: passages
    source: data/processed/passages/schema-v1
    required: true
    authentication: [object_inventory, table_hashes, file_hashes]
    expected_hashes:
      data/processed/passages/schema-v1/table-hashes.json: b7741f800932a623e1ce7a53d79628ce2429b6626370ef5a6c4a11161832f7cf
      config/benchmark.yaml: 13f0c0353a7b5a67232ccdf727c3be4c010dc407bb75c36f4837bacef1a4a296
  - artifact_id: canonical-tokens
    role: tokens
    source: data/processed
    required: true
    authentication: [object_inventory, table_hashes, file_hashes]
    expected_hashes:
      data/processed/macula-greek/24.06.17/table-hashes.json: 2f521b87cb7b74cb9f032e41deff3b21c15db1d2f6f2b480c2324a7bb799d876
      data/processed/macula-hebrew/25.08.11/table-hashes.json: 54b9b41dc939fe7e526fcb62c4772e86b9f053f829e2a2d556fb16049311f093
      data/processed/oshb-morphhb/master-3d15126/table-hashes.json: 810e7426e5fa3b10b12affc3d338bf0a031bd7b66d112176a4c12bc27ccc0573
  - artifact_id: positive-control-v1
    role: benchmark
    source: data/benchmarks/positive_controls.yaml
    required: true
    authentication: [file_hashes]
    expected_hashes:
      data/benchmarks/positive_controls.yaml: e9b1721b2618d950e9449d218d8107fdb127ac9bcd0ade5f6c11b0b25b37160e
      data/benchmarks/positive_controls.csv: 58cad772a69e496046b45d24925c764d6b04798fb57cb767b6e633e2aa1eff9d
  - artifact_id: openbible-knownness-v1
    role: knownness
    source: data/processed/benchmarks/schema-v1
    required: true
    authentication: [table_hashes, file_hashes]
    expected_hashes:
      data/processed/benchmarks/schema-v1/table-hashes.json: 1cfaab5de2904e283b466044b2cd38d0acdc6f6fef929bc397e720ce6d3838fd

embedding_model:
  model_id: intfloat/multilingual-e5-small
  revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
  license: MIT
  tokenizer: XLM-R SentencePiece
  dimensions: 384
  maximum_tokens: 512
  pooling: mean_l2
  symmetric_prefix: "query: "
  allowed_files:
    1_Pooling/config.json: 987f7a67a38fa564c849bb5d277c52ab9088a84368fc0be31a354125aebb12a0
    config.json: 69137736cab8b8903a07fe8afaafdda25aac55415a12a55d1bffa9f581abf959
    model.safetensors: 1a55775f53449dac10a2bcbc312469fac40b96d53198c407081a831f81c98477
    modules.json: c6e29747481e8b5dd2b58401966aeac910de39092f90cda9a704b1545f902b04
    sentence_bert_config.json: 948201d8329907aae938fa62f9ceeed53f5694dacc2b87b9f3b78b37ee986529
    sentencepiece.bpe.model: cfc8146abe2a0488e9e2a0c56de7952f7c11ab059eca145a0a727afce0db2865
    special_tokens_map.json: d05497f1da52c5e09554c0cd874037a083e1dc1b9cfd48034d1c717f1afc07a7
    tokenizer.json: 0b44a9d7b51c3c62626640cda0e2c2f70fdacdc25bbbd68038369d14ebdf4c39
    tokenizer_config.json: a1d6bc8734a6f635dc158508bef000f8e2e5a759c7d92f984b2c86e5ff53425b
  possible_training_or_benchmark_exposure: >-
    Possible and unquantified: broad multilingual web pretraining may include biblical
    text or related benchmarks. Treat embeddings as supplemental retrieval evidence,
    never as independent proof of literary dependence.
  dependency_versions:
    sentence-transformers: 5.7.0
    transformers: 5.14.1
    torch: 2.13.0
    tokenizers: 0.22.2
    huggingface-hub: 1.27.0
    safetensors: 0.8.0
    scikit-learn: 1.9.0
  optional: true

retrieval:
  sparse_top_k: 16
  embedding_top_k: 16
  block_size: 256
  maximum_m7_seed_pairs: 100000
  candidate_universe: union_sparse_embedding_structure_and_top_m7_with_benchmark_evaluation
  positive_controls_always_evaluated_outside_discovery_tiers: true
  multiple_testing_scope: complete_preregistered_retained_candidate_universe

formulaic_control:
  method: primary_corpus_high_df_lemma_root_ngrams
  ngram_sizes: [2, 3]
  minimum_document_frequency_fraction: 0.01
  minimum_document_count: 25
  minimum_distinct_high_df_features: 1
  minimum_high_df_feature_fraction: 0.20
  sensitivity_uses_primary_vocabulary: true

detectors:
  - detector_id: m7_lexical_rrf
    family: lexical
    independence_group: lexical_m7
    original_language_capable: true
    contains_english_derived_evidence: true
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: within_book_reassignment
  - detector_id: semantic_domain_overlap
    family: semantic
    independence_group: semantic_annotations
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: lemma_root_sequence_semantic
    family: semantic
    independence_group: lexical_m7
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: false
    normalization: rank_percentile
    null_family: stratified_score_bootstrap
  - detector_id: multilingual_e5_original_language
    family: semantic
    independence_group: pretrained_semantic
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: multilingual_e5_english_gloss
    family: semantic
    independence_group: english_bridge
    original_language_capable: false
    contains_english_derived_evidence: true
    counts_for_independence: false
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: grammar_sequence_alignment
    family: grammar_syntax
    independence_group: grammar_annotations
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: grammar_rare_pattern
    family: grammar_syntax
    independence_group: grammar_annotations
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: participant_frame_progression
    family: structure_narrative
    independence_group: structural_annotations
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: true
    normalization: empirical_percentile
    null_family: stratified_permutation
  - detector_id: stratified_representation_anomaly
    family: anomaly
    independence_group: anomaly_diagnostic
    original_language_capable: true
    contains_english_derived_evidence: false
    counts_for_independence: false
    normalization: zscore_within_stratum
    null_family: stratified_permutation

calibration:
  seeds:
    within_book_reassignment: 9111
    stratified_score_bootstrap: 9112
    stratified_permutation: 9113
    tier_tie_break: 9114
  fixture_iterations: 20
  production_iterations: 1000
  minimum_effective_null_draws: 20000
  maximum_empirical_fdr: 0.20
  maximum_bh_q_value: 0.05
  minimum_independent_families: 2
  require_both_m7_null_families: true
  multiple_testing_method: benjamini_hochberg
  threshold_selection: frozen_before_identity_review

ensemble:
  method: weighted_mean_max_within_independence_group
  group_weights:
    lexical_m7: 0.20
    semantic_annotations: 0.18
    pretrained_semantic: 0.14
    english_bridge: 0.03
    grammar_annotations: 0.20
    structural_annotations: 0.20
    anomaly_diagnostic: 0.05
  missing_group_score: 0.0
  qualifying_group_normalized_score: 0.90
  minimum_tier_a_ensemble_score: 0.65
  english_ablation_keeps_registered_denominator: true
  anomaly_is_diagnostic_not_independent: true
  final_null_method: stratified_candidate_pair_permutation

tiers:
  tier_a_label: statistically_eligible
  tier_b_label: exploratory_not_statistically_accepted
  tier_b_size: 100
  retain_known_pairs: true
  known_pairs_tier_a_eligible: false
  require_bidirectional_knownness_check: true
  require_remove_all_english_ablation: true
  tier_a_quality_exclusions: [disputed_passage, reference_gap, ketiv_uncertainty]
  basic_exclusions:
    - self_pair
    - overlapping_passages
    - unresolved_data_error
    - invalid_trace
    - local_context
    - exact_or_near_duplicate
    - same_reference_sensitivity

review:
  formats: [csv, parquet, dossier_markdown, output_j_template]
  tier_a_dossier_limit: 100
  preserve_rejections: true
  require_original_language_trace: true
  glosses_are_supplemental: true
  reviewer_classes:
    - direct_quotation
    - probable_literary_allusion
    - possible_literary_echo
    - narrative_or_structural_parallel
    - thematic_relationship
    - formal_coincidence
    - data_artifact
    - not_reviewed
  rejection_categories:
    - formulaic_language
    - common_topic_only
    - named_entity_only
    - local_or_overlapping_context
    - translation_artifact
    - annotation_artifact
    - data_quality
    - insufficient_independent_evidence
    - already_known
    - other

stages:
  - number: 1
    stage_id: authenticate_materialize_inputs
    dependencies: []
    expensive: false
    upload_after_completion: false
  - number: 2
    stage_id: semantic_representations_indexes
    dependencies: [1]
    expensive: true
    upload_after_completion: true
  - number: 3
    stage_id: semantic_candidate_evidence
    dependencies: [2]
    expensive: true
    upload_after_completion: true
  - number: 4
    stage_id: grammatical_syntactic_evidence
    dependencies: [1]
    expensive: true
    upload_after_completion: true
  - number: 5
    stage_id: structural_narrative_evidence
    dependencies: [1]
    expensive: true
    upload_after_completion: true
  - number: 6
    stage_id: anomaly_evidence
    dependencies: [3, 4, 5]
    expensive: true
    upload_after_completion: true
  - number: 7
    stage_id: empirical_null_controls
    dependencies: [3, 4, 5, 6]
    expensive: true
    upload_after_completion: true
  - number: 8
    stage_id: transparent_final_ensemble
    dependencies: [3, 4, 5, 6, 7]
    expensive: false
    upload_after_completion: true
  - number: 9
    stage_id: tier_a_tier_b_outputs
    dependencies: [8]
    expensive: false
    upload_after_completion: true
  - number: 10
    stage_id: strict_validation
    dependencies: [9]
    expensive: false
    upload_after_completion: true
  - number: 11
    stage_id: package_upload_verify
    dependencies: [10]
    expensive: false
    upload_after_completion: true

cloud:
  production_operating_system: linux
  production_requires_explicit_environment_authorization: true
  authorization_environment_variable: ECHOES_AUTHORIZE_PRODUCTION
  authorization_value: final-discovery-v1
  credentials_via_environment_only: true
  hard_budget_usd: 75.0
  no_automatic_provisioning: true
  direct_b2_upload_before_cleanup: true

lxx:
  activation: deferred_non_blocking
  reason: >-
    Swete TEI is legally reusable with attribution and share-alike obligations, but a
    validated full-canon morphology and Hebrew alignment do not exist on the campaign
    schedule. CATSS and Rahlfs-derived paths remain unsuitable or unresolved.
  final_experiment_valid_without_lxx: true

lexical_reuse_policy: authenticate_and_reuse_canonical_m7_never_recompute
learned_ensemble_allowed: false
cosine_alone_can_create_tier_a: false
post_identity_threshold_changes_allowed: false
stop_after_canonical_run_and_review: true
