scope:
  profile: edition_complete
  granularity: verse
  hebrew_reading: qere
  greek_reading: source
  corpus_pairs: [hb_hb, gnt_gnt, hb_gnt_english_bridge]
  smoke_test_granularities: [clause, sentence, two_verse, five_verse]
  exhaustive_smoke_test_calibration_allowed: false

sensitivity_scopes:
  critical_core_greek:
    enabled: true
    analysis_profile: critical_core
    hebrew_reading: qere
    greek_reading: source
    granularity: verse
    corpus_pairs: [gnt_gnt, hb_gnt_english_bridge]
    full_tier3_evaluation: true
    repeated_nulls: false
  hebrew_qere_ketiv:
    enabled: true
    analysis_profile: edition_complete
    baseline_reading: qere
    comparison_reading: ketiv
    granularity: verse
    corpus_pair: hb_hb
    query_scope: oshb_affected_verse_references
    target_scope: full_hebrew_verse_corpus
    repeated_nulls: false

representations:
  - original_language_lemma
  - original_language_root
  - normalized_surface
  - part_of_speech_sequence
  - morphology_sequence
  - english_gloss_bridge

detectors:
  - jaccard
  - weighted_jaccard
  - tfidf_cosine
  - bm25
  - rare_lemma_root
  - phrase_association
  - longest_common_subsequence
  - weighted_sequence_alignment
  - pos_morphology_support

feature_frequency_thresholds:
  high_document_frequency_ratio: 0.1
  formulaic_document_frequency_ratio: 0.05
  formulaic_minimum_corpus_count: 20
  proposal_maximum_document_frequency_ratio: 0.25
  proposal_filter_preserves_persisted_evidence: true

tfidf:
  dtype: float64
  sublinear_tf: true
  smooth_idf: true
  norm: l2
  idf_formula: log((1+n_documents)/(1+document_frequency))+1

bm25:
  dtype: float64
  k1: 1.2
  b: 0.75
  idf_formula: log(1+(n_documents-document_frequency+0.5)/(document_frequency+0.5))
  query_term_frequency: binary

jaccard:
  binary_enabled: true
  weighted_enabled: true
  weight: inverse_document_frequency
  empty_union_score: 0.0

phrases:
  lemma_ngram_sizes: [2, 3]
  root_ngram_sizes: [2, 3]
  minimum_corpus_count: 2
  pmi_cap: 10.0
  association_methods: [pmi, log_likelihood]

skipgrams:
  enabled: true
  maximum_gap: 2
  minimum_corpus_count: 2
  cross_passage_boundary: false

sequence:
  lcs_enabled: true
  weighted_alignment_enabled: true
  apply_only_to_candidate_union: true
  match_weight: 2.0
  rarity_weight_enabled: true
  pos_morphology_support_enabled: true
  mismatch_penalty: -1.0
  gap_penalty: -1.0

retrieval:
  candidate_union_k: 250
  persisted_top_k: 100
  evaluation_k: 100
  expensive_sequence_rerank_k: 25
  persisted_candidate_pool_k: 25
  sparse_only: true
  dense_all_pairs_allowed: false
  tie_break: score_desc_passage_id_asc

composite:
  method: reciprocal_rank_fusion
  rrf_k: 60
  learned_model_allowed: false
  preserve_detector_contributions: true
  mix_english_with_original_language: false

score_quantization_decimals: 12

benchmark:
  included_tiers: [3]
  eligible_mapping_statuses: [mapped_verified, mapped_provisional, mapped_partial]
  split_strategies:
    - held_out_book
    - held_out_book_pair
    - held_out_source_passage
    - held_out_genre
  vote_strata:
    - negative
    - zero
    - one_to_two
    - three_to_five
    - six_to_ten
    - eleven_to_twenty_five
    - twenty_six_plus
  metrics:
    - recall_at_5
    - recall_at_10
    - recall_at_20
    - mean_reciprocal_rank
    - ndcg_at_20
    - precision_at_10
    - coverage
  comparison_baselines: [random, length_matched, unweighted_overlap, presumed_negatives]
  enforce_leakage_groups: true
  label: tier3_weak_supervision_recovery
  minimum_eligible_queries_per_primary_stratum: 100
  minimum_eligible_relationships_per_primary_stratum: 100
  insufficient_stratum_action: report_no_claim_and_exempt_composite_gate

bootstrap_iterations: 1000
bootstrap_seed: 7201

null_models:
  iterations_per_family: 100
  calibration_pair_sample_size: 20000
  calibration_pair_scope: deterministic_candidate_union_sample
  global_all_pairs_calibration_claim_allowed: false
  within_book_reassignment:
    enabled: true
    seed: 7101
    method: within_book_feature_token_reassignment
    preserve_passage_counts: true
    preserve_passage_lengths: true
    preserve_language_namespace: true
    label_or_order_shuffle: false
  frequency_preserving_synthetic:
    enabled: true
    seed: 7102
    method: frequency_preserving_synthetic_passages
    preserve_passage_counts: true
    preserve_passage_lengths: true
    preserve_language_namespace: true
    label_or_order_shuffle: false
  english_features_reassigned_by_source_corpus_and_book: true
  synthetic_primary_conditioning: book_then_genre_when_sparse
  synthetic_minimum_book_token_count: 100
  retain_every_replicate: true

candidate_thresholds:
  selection_method: preregistered_grid_with_empirical_fdr
  detector_score_grid: [0.02, 0.04, 0.06, 0.08, 0.1]
  rrf_score_grid: [0.02, 0.04, 0.06, 0.08, 0.1]
  maximum_empirical_fdr: 0.2
  require_both_null_families: true
  calibrate_every_threshold: true
  inspect_candidate_identities_before_selection: false
  weaken_to_meet_queue_quota: false
  freeze_before_queue: true

rare_evidence:
  maximum_corpus_frequency: 3
  threshold_source: configuration
  require_independent_co_signal: true
  single_rare_item_sufficient: false
  proper_name_only_sufficient: false
  allowed_co_signals:
    - second_distinct_rare_lemma_or_root
    - phrase_with_additional_lexical_material
    - ordered_sequence_with_two_additional_features
    - independent_pos_or_morphology_sequence
    - non_restatement_detector_family
  disallowed_correlated_signals:
    - tfidf_bm25_same_item
    - lemma_surface_same_token
    - rare_item_plus_removed_stop_feature
    - lemma_root_same_item
    - forward_reverse_same_evidence
    - english_translation_same_item

penalties:
  preserve_raw_scores: true
  formulaic_penalty: 0.5
  local_context_penalty: 0.5
  short_passage_penalty: 0.75
  nearby_verse_distance: 5
  short_passage_token_count: 5
  self_pairs: exclude
  exact_overlap: exclude
  overlapping_windows: exclude
  adjacency: retain_flag_normally_ineligible
  same_book: retain_flag
  formulaic: retain_score_and_penalty
  disputed_text: retain_flag_require_sensitivity
  reference_gap: retain_flag
  ketiv_uncertainty: retain_flag

ablations:
  names:
    - remove_tfidf
    - remove_bm25
    - remove_rare_evidence
    - remove_phrase_evidence
    - remove_ordered_sequence
    - remove_formulaic_penalty
    - remove_local_context_penalty
    - remove_all_english_derived_features
  select_new_model_from_ablation_results: false

exclusions:
  self_pairs: exclude
  exact_overlap: exclude
  overlapping_windows: exclude
  mapping_ineligible: exclude_with_reason
  unresolved_data_error: exclude_with_reason
  represented_openbible_pairs_from_unreviewed_queue: exclude_either_direction
  retain_all_excluded_candidates_with_reason: true

held_out_test_tuning_allowed: false
failed_results_are_preserved: true
methodological_change_requires_new_experiment_version: true
